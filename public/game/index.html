<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>동아줄을 당겨라! 남매의 하늘 길</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root{
    --sky1:#fcd9a8; --sky2:#a8d8ff; --night:#1b2a52;
    --ink:#2b2440; --gold:#ffb703; --pink:#ff7aa2; --green:#5fbf6a;
    --paper:#fff8ee;
  }
  html,body{height:100%;}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:linear-gradient(180deg,#ffe6c2 0%,#bfe2ff 60%,#8ec9ff 100%);
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:12px;
  }
  #game{
    width:min(96vw,880px); max-width:880px; background:var(--paper);
    border:6px solid var(--ink); border-radius:22px; overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.25); position:relative;
  }
  /* HUD */
  #hud{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:800;flex-wrap:wrap;}
  #hud .pill{background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px;font-size:14px;}
  #hud .grow{flex:1;}
  #hud .score{background:var(--gold);color:#3a2a00;}
  #items{font-size:18px;letter-spacing:2px;}
  /* stage */
  #stage{padding:22px 20px 26px;min-height:440px;display:flex;flex-direction:column;}
  h1{font-size:32px;line-height:1.25;text-align:center;margin-bottom:6px;font-family:'Gaegu',inherit;}
  h2{font-size:25px;margin-bottom:10px;text-align:center;font-family:'Gaegu',inherit;}
  p{font-size:17px;line-height:1.6;}
  .center{align-items:center;justify-content:center;text-align:center;}
  .sub{color:#6a6280;font-size:15px;text-align:center;margin-bottom:14px;}
  .concept{background:#eaf5ff;border:2px dashed #6db3ff;border-radius:14px;padding:12px 14px;margin:14px 0;font-size:15px;color:#185a9d;font-weight:700;text-align:center;}
  .btn{
    font-family:inherit;font-weight:800;font-size:18px;cursor:pointer;border:none;
    background:var(--gold);color:#3a2a00;padding:14px 22px;border-radius:14px;
    box-shadow:0 4px 0 #c98a00; transition:transform .05s, box-shadow .05s; margin:6px;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c98a00;}
  .btn.alt{background:#7cc4ff;box-shadow:0 4px 0 #2f86d6;color:#06375f;}
  .btn.alt:active{box-shadow:0 1px 0 #2f86d6;}
  .btn.green{background:var(--green);box-shadow:0 4px 0 #3a9145;color:#0c3a14;}
  .btn.big{font-size:22px;padding:18px 30px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  /* character select */
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:6px;}
  .card{background:#fff;border:3px solid #d9d0bf;border-radius:18px;padding:16px 12px;text-align:center;cursor:pointer;transition:.15s;}
  .card:hover{border-color:var(--gold);transform:translateY(-3px);}
  .card .face{font-size:52px;}
  .card .nm{font-weight:800;font-size:19px;margin-top:6px;}
  .card .desc{font-size:13px;color:#6a6280;margin-top:4px;line-height:1.4;}
  .card .tag{display:inline-block;margin-top:8px;background:#fff3d4;color:#9a6b00;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;}
  /* comic */
  .panel{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:18px;margin:10px 0;display:flex;gap:14px;align-items:center;animation:pop .25s ease;}
  @keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
  .panel .who{font-size:48px;}
  .bubble{background:#f3f0ff;border-radius:14px;padding:12px 14px;flex:1;font-size:17px;line-height:1.5;}
  .bubble b{color:#7a4fd0;}
  /* 만화 페이지 (캡처 이미지 스타일) */
  .comicpage{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#e7dfce;
             border:4px solid var(--ink);border-radius:14px;padding:8px;animation:pop .25s ease;}
  .cpanel{position:relative;background:#fdf6ec;border:3px solid var(--ink);border-radius:9px;
          min-height:198px;display:flex;flex-direction:column;align-items:center;
          padding:9px 8px 0;overflow:hidden;}
  .cpanel.wide{grid-column:1 / -1;min-height:158px;}
  /* 그려진 배경 풍경 레이어 */
  .cbg{position:absolute;inset:0;z-index:0;}
  .cbg .bgsvg{width:100%;height:100%;display:block;}
  /* 말풍선 영역(위) — 얼굴을 절대 가리지 않음 */
  .cbubblezone{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:38px;z-index:3;}
  /* 캐릭터 영역(아래) */
  .cscene{position:relative;z-index:2;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%;
          font-size:50px;line-height:1;padding-bottom:4px;}
  .cscene .lg{font-size:62px;} .cscene .sm{font-size:30px;}
  .wob{animation:wob 1.4s ease-in-out infinite;transform-origin:50% 92%;}
  @keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .actor{width:84px;height:auto;display:block;filter:drop-shadow(2px 3px 0 rgba(43,36,64,.22));}
  .actor.a-sm{width:52px;}
  .cbubble{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:16px;
           padding:5px 11px;font-size:16px;font-weight:700;line-height:1.3;max-width:94%;text-align:center;
           font-family:'Gaegu',inherit;}
  .cbubble:before{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-14px;
                  border:8px solid transparent;border-top-color:var(--ink);}
  .cbubble:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-9px;
                 border:6px solid transparent;border-top-color:#fff;}
  .cbubble b{color:#e0581a;}
  .cbubble.think{border-style:dashed;}
  .csfx{position:absolute;top:42px;right:8px;font-family:'Gaegu',inherit;font-weight:700;color:#e0581a;
        font-size:23px;transform:rotate(-11deg);z-index:4;text-shadow:1.5px 1.5px 0 #fff,-1px -1px 0 #fff;}
  .cnarr{position:relative;z-index:3;width:calc(100% + 16px);margin:6px -8px 0;background:rgba(43,36,64,.88);color:#fff;
         font-size:13px;font-weight:700;padding:5px 8px;text-align:center;font-family:'Gaegu',inherit;}
  /* 아이템 장착 연출 */
  .equipwrap{position:relative;display:flex;justify-content:center;align-items:flex-end;height:175px;margin:6px 0;}
  .equipwrap .actor{width:148px;animation:pop .3s ease;}
  .equipitem{position:absolute;top:0;font-size:46px;animation:equipIn 1s ease forwards;}
  @keyframes equipIn{0%{transform:translateY(-130px) scale(.4) rotate(-25deg);opacity:0;}
    55%{transform:translateY(40px) scale(1.35);opacity:1;}100%{transform:translateY(40px) scale(0);opacity:0;}}
  .equipspark{position:absolute;font-size:34px;animation:sparkPop .9s .45s ease forwards;opacity:0;}
  @keyframes sparkPop{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.5)}}
  /* 정답 축하 */
  .praisewrap{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;min-height:420px;}
  .praisebig{font-family:'Gaegu',inherit;font-size:42px;font-weight:800;color:#e0581a;text-align:center;animation:praisePop .5s ease;text-shadow:2px 2px 0 #fff;}
  @keyframes praisePop{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1) rotate(0)}}
  .praisehero .actor{width:120px;animation:hop .6s ease infinite alternate;}
  @keyframes hop{from{transform:translateY(0)}to{transform:translateY(-12px)}}
  .praisesub{font-size:19px;font-weight:800;margin:8px 0 16px;}
  .confetti{position:absolute;top:-20px;width:11px;height:15px;z-index:5;animation:fall linear forwards;}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(470px) rotate(760deg)}}
  .firework{position:absolute;width:9px;height:9px;border-radius:50%;z-index:5;animation:fw .85s ease-out forwards;}
  @keyframes fw{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
  /* 지렛대 미션 */
  .leverstage{position:relative;height:172px;background:linear-gradient(180deg,#dff0ff,#f3e2b3);border:3px solid var(--ink);border-radius:12px;margin:6px 0;overflow:hidden;}
  .lv-ground{position:absolute;left:0;right:0;bottom:26px;height:5px;background:#8a6b3a;}
  .lv-beam{position:absolute;bottom:42px;left:8%;width:84%;height:13px;background:#a9772f;border:2px solid var(--ink);border-radius:7px;transition:transform .8s ease;}
  .lv-ful{position:absolute;bottom:26px;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:28px solid #6b6b6b;transition:left .3s;}
  .lv-rock{position:absolute;bottom:54px;font-size:42px;transition:all .8s ease;}
  .lv-press{position:absolute;bottom:50px;right:7%;}
  /* 수평잡기 미션 */
  .balstage{position:relative;height:188px;background:linear-gradient(180deg,#dff0ff,#cdeccb);border:3px solid var(--ink);border-radius:12px;margin:6px 0;overflow:hidden;}
  .bl-post{position:absolute;left:50%;bottom:30px;width:9px;height:82px;background:#8a6b3a;transform:translateX(-50%);}
  .bl-ful{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:30px solid #6b6b6b;}
  .bl-beam{position:absolute;left:50%;bottom:108px;width:236px;margin-left:-118px;height:11px;background:#a9772f;border:2px solid var(--ink);border-radius:7px;transform-origin:50% 50%;transition:transform .45s ease;}
  .bl-pan{position:absolute;top:10px;display:flex;flex-direction:column;align-items:center;font-size:30px;}
  .bl-pan.l{left:-10px;} .bl-pan.r{right:-10px;}
  .bl-w{font-family:'Gaegu',inherit;font-weight:800;font-size:18px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 7px;margin-bottom:2px;}
  /* spring game */
  .springwrap{display:flex;justify-content:space-around;align-items:flex-start;gap:8px;margin:8px 0 4px;}
  .spunit{text-align:center;flex:1;}
  .scale{width:10px;background:#bdbdbd;margin:0 auto;border-radius:6px;}
  .coil{width:34px;margin:0 auto;background:repeating-linear-gradient(#bbb,#bbb 4px,#888 4px,#888 8px);border-radius:4px;transition:height .5s ease;}
  .hook{font-size:34px;}
  .reading{font-weight:800;color:#185a9d;font-size:16px;min-height:20px;}
  .ddeok{font-size:40px;cursor:pointer;}
  /* climb */
  #climbArea{position:relative;height:300px;background:linear-gradient(180deg,#bfe2ff,#fff8ee);border:3px solid var(--ink);border-radius:14px;overflow:hidden;margin:6px 0;}
  .rope{position:absolute;top:0;bottom:0;width:8px;background:repeating-linear-gradient(#a9772f,#a9772f 8px,#7c531c 8px,#7c531c 16px);left:50%;transform:translateX(-50%);}
  .climber{position:absolute;left:50%;transform:translateX(-50%);font-size:40px;transition:bottom .15s;}
  .meterbox{height:22px;background:#e6ddcc;border-radius:999px;overflow:hidden;border:2px solid var(--ink);}
  .meter{height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff9f1c);transition:width .15s;}
  /* boss */
  #boss{position:relative;height:340px;background:linear-gradient(180deg,#2b3d6b,#6f8fd0);border:3px solid var(--ink);border-radius:14px;overflow:hidden;}
  #hero{position:absolute;bottom:6px;font-size:38px;transition:left .08s linear;}
  .falling{position:absolute;font-size:30px;}
  .flash{animation:flash .3s;}
  @keyframes flash{0%,100%{filter:none;}50%{filter:drop-shadow(0 0 8px red);}}
  .hint{font-size:13px;color:#8a8;text-align:center;margin-top:6px;}
  .small{font-size:13px;color:#6a6280;text-align:center;margin-top:10px;}
  .win{font-size:26px;text-align:center;font-weight:800;color:#185a9d;}

  /* ===== 반응형: 태블릿·데스크톱에서 만화 크게 또렷하게 ===== */
  @media (min-width:760px){
    #stage{padding:26px 28px 30px;}
    h1{font-size:38px;} h2{font-size:30px;} p{font-size:18px;}
    .comicpage{gap:12px;padding:12px;border-radius:16px;}
    .cpanel{min-height:232px;border-radius:12px;padding:11px 11px 0;}
    .cpanel.wide{min-height:182px;}
    .cscene{font-size:64px;padding-bottom:6px;}
    .cscene .lg{font-size:82px;} .cscene .sm{font-size:42px;}
    .actor{width:112px;} .actor.a-sm{width:68px;}
    .cbubble{font-size:19px;padding:7px 14px;border-radius:18px;}
    .csfx{font-size:29px;top:50px;}
    .cnarr{font-size:15px;padding:7px 10px;}
    .btn{font-size:20px;padding:15px 24px;} .btn.big{font-size:24px;}
    .praisebig{font-size:54px;} .praisehero .actor{width:150px;}
    #climbArea{height:340px;} #boss{height:380px;}
  }
  /* 큰 데스크톱: 4컷이 한 화면에 시원하게 */
  @media (min-width:1100px){
    #game{max-width:980px;width:min(92vw,980px);}
    .cpanel{min-height:250px;}
    .cscene .lg{font-size:90px;} .actor{width:122px;}
  }
  /* 작은 폰: 답답하지 않게 축소 */
  @media (max-width:520px){
    #stage{padding:16px 14px 20px;}
    .cpanel{min-height:168px;}
    .cscene{font-size:42px;} .cscene .lg{font-size:52px;} .cscene .sm{font-size:26px;}
    .actor{width:70px;} .actor.a-sm{width:46px;}
    .cbubble{font-size:14px;padding:4px 9px;}
    h1{font-size:25px;} h2{font-size:20px;}
  }
  /* 가로가 매우 넓고 낮은 화면(태블릿 가로): 세로 넘침 방지 */
  @media (min-width:760px) and (max-height:740px){
    .cpanel{min-height:190px;} .cpanel.wide{min-height:150px;}
    .cscene .lg{font-size:66px;} .actor{width:92px;} .actor.a-sm{width:58px;}
  }
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <span class="pill" id="hudChar">🙂 주인공</span>
    <span class="pill" id="hudLevel">Lv.0</span>
    <span class="pill" id="hudItems"><span id="items"></span></span>
    <span class="grow"></span>
    <button class="pill" id="mute" style="cursor:pointer;border:none;font:inherit;font-weight:800;color:#fff;">🔊</button>
    <span class="pill score" id="hudScore">⭐ 0점</span>
  </div>
  <div id="stage"></div>
</div>

<script>
/* =========================================================
   동아줄을 당겨라! 남매의 하늘 길
   초등 3학년 과학「힘과 우리 생활」: 무게·중력·용수철·당기는 힘
   ========================================================= */

const stage = document.getElementById('stage');
const state = { char:null, level:0, score:0, items:[], mistakes:0, gear:{} };

const CHARS = {
  sun:   {face:'👦', nm:'오빠 (해)',   desc:'힘이 세요. 동아줄을 빠르게 당겨요!', tag:'당기기 강함', pull:14, evolve:'☀️ 해님', atype:'boy',  acolor:'#e8543f'},
  moon:  {face:'👧', nm:'여동생 (달)', desc:'가볍고 날쌔요. 떨어지는 것을 잘 피해요!', tag:'회피 강함', pull:10, evolve:'🌙 달님', atype:'girl', acolor:'#36b3a6'},
  mother:{face:'👩', nm:'어머니',      desc:'떡 장수예요. 무게 재기에서 힌트를 줘요!', tag:'무게 힌트', pull:10, evolve:'🌟 별님', atype:'mom',  acolor:'#cf6f8f'},
  tiger: {face:'🐯', nm:'호랑이 (체험)',desc:'아주 무거워요. 줄이 잘 끊어진답니다!', tag:'반례 학습', pull:8, evolve:'🐅 산신령 호랑이', atype:'tiger', acolor:'#f6a83a'}
};
const GEARMAP = {'🎒':['bag'], '🪵':['staff'], '🪢✨':['rope'], '🛡️':['cape','shield'], '⚖️':['medal'], '👑':['crown'], '🏆':['trophy']};

/* ====== 정교한 SVG 캐릭터 (한복 남매·호랑이·다람쥐, 표정/연기 풍부) ====== */
const INK='#3a2b22';
function faceFeatures(f){
  const ink=INK;
  const oeye=(x,rx,ry)=>`<ellipse cx="${x}" cy="-4" rx="${rx}" ry="${ry}" fill="#fff" stroke="${ink}" stroke-width="1.4"/><circle cx="${x}" cy="-3" r="${Math.min(rx,ry)*0.72}" fill="${ink}"/><circle cx="${x-1.6}" cy="-5.6" r="1.6" fill="#fff"/>`;
  const happy=`<path d="M-8 12 Q0 20 8 12" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`;
  let brow='',eyes='',mouth='',extra='';
  switch(f){
    case 'laugh':
      brow=`<path d="M-18 -12 q5 -3 11 0 M7 -12 q6 -3 11 0" stroke="${ink}" stroke-width="2" fill="none"/>`;
      eyes=`<path d="M-17 -2 q6 -8 12 0 M5 -2 q6 -8 12 0" stroke="${ink}" stroke-width="2.6" fill="none"/>`;
      mouth=`<path d="M-9 9 Q0 24 9 9 Z" fill="${ink}"/><path d="M-5 16 Q0 20 5 16" stroke="#ff7a8a" stroke-width="2.4" fill="none"/>`; break;
    case 'shock':
      brow=`<path d="M-18 -16 q5 -2 11 -1 M7 -17 q6 -1 11 1" stroke="${ink}" stroke-width="2" fill="none"/>`;
      eyes=oeye(-11,6,7.6)+oeye(11,6,7.6);
      mouth=`<ellipse cx="0" cy="14" rx="5.5" ry="7" fill="${ink}"/>`; break;
    case 'angry':
      brow=`<path d="M-18 -9 L-5 -5 M18 -9 L5 -5" stroke="${ink}" stroke-width="2.8" stroke-linecap="round"/>`;
      eyes=oeye(-10,5,5.4)+oeye(10,5,5.4);
      mouth=`<path d="M-8 16 Q0 9 8 16" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`; break;
    case 'sweat': case 'scared':
      brow=`<path d="M-18 -14 L-7 -10 M18 -14 L7 -10" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`;
      eyes=oeye(-11,5.4,6.4)+oeye(11,5.4,6.4);
      mouth=`<path d="M-7 15 q7 4 14 0" stroke="${ink}" stroke-width="2.2" fill="none"/>`;
      extra=`<path d="M20 -3 q5 9 0 15 q-5 -6 0 -15z" fill="#5ec8ff" stroke="${ink}" stroke-width="1"/>`; break;
    case 'cry':
      brow=`<path d="M-18 -12 q5 -3 11 0 M7 -12 q6 -3 11 0" stroke="${ink}" stroke-width="2" fill="none"/>`;
      eyes=`<path d="M-17 -2 q6 6 12 0 M5 -2 q6 6 12 0" stroke="${ink}" stroke-width="2.4" fill="none"/>`;
      mouth=`<path d="M-7 17 q7 -8 14 0" stroke="${ink}" stroke-width="2.4" fill="none"/>`;
      extra=`<path d="M-13 2 q-3 9 0 14" stroke="#5ec8ff" stroke-width="2.6" fill="none"/><path d="M13 2 q3 9 0 14" stroke="#5ec8ff" stroke-width="2.6" fill="none"/>`; break;
    case 'smug':
      brow=`<path d="M-18 -11 h11 M7 -11 h11" stroke="${ink}" stroke-width="2"/>`;
      eyes=`<path d="M-17 -3 h11 M6 -3 h11" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`;
      mouth=`<path d="M-7 13 q9 7 15 -2" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`; break;
    case 'determined':
      brow=`<path d="M-18 -12 L-7 -9 M18 -12 L7 -9" stroke="${ink}" stroke-width="2.8" stroke-linecap="round"/>`;
      eyes=oeye(-10,5,5.6)+oeye(10,5,5.6);
      mouth=`<path d="M-8 15 h16" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`; break;
    case 'dizzy':
      eyes=`<path d="M-16 -9 l10 10 M-6 -9 l-10 10 M6 -9 l10 10 M16 -9 l-10 10" stroke="${ink}" stroke-width="2"/>`;
      mouth=`<path d="M-7 15 q7 5 14 0" stroke="${ink}" stroke-width="2.2" fill="none"/>`; break;
    case 'sparkle':
      brow=`<path d="M-18 -12 q5 -3 11 0 M7 -12 q6 -3 11 0" stroke="${ink}" stroke-width="2" fill="none"/>`;
      eyes=`<text x="-18" y="2" font-size="15">✨</text><text x="4" y="2" font-size="15">✨</text>`;
      mouth=`<path d="M-9 9 Q0 22 9 9 Z" fill="${ink}"/>`; break;
    case 'wink':
      brow=`<path d="M-18 -12 q5 -3 11 0 M7 -12 q6 -3 11 0" stroke="${ink}" stroke-width="2" fill="none"/>`;

/* ---------- 배경음악 & 효과음 (Web Audio, 외부 파일 없음) ---------- */
const audio={ctx:null,muted:false,timer:null,step:0,master:null};
function ac(){
  if(!audio.ctx){ try{
    audio.ctx=new (window.AudioContext||window.webkitAudioContext)();
    audio.master=audio.ctx.createGain(); audio.master.gain.value=0.5;
    audio.master.connect(audio.ctx.destination);
  }catch(e){} }
  return audio.ctx;
}
function tone(freq,dur,t0,type,vol){
  const c=ac(); if(!c||!freq) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'triangle'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(vol||0.05,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(audio.master); o.start(t0); o.stop(t0+dur+0.03);
}
const MEL=[659,0,784,659,587,659,523,0, 587,659,784,659,587,523,0,0]; // 가볍고 경쾌한 멜로디
function startMusic(){
  const c=ac(); if(!c) return; if(c.state==='suspended') c.resume();
  if(audio.timer) return; audio.step=0;
  audio.timer=setInterval(()=>{
    const f=MEL[audio.step];
    if(!audio.muted){
      if(f) tone(f,0.22,c.currentTime,'triangle',0.05);
      if(audio.step%4===0) tone(f?f/2:262,0.26,c.currentTime,'sine',0.035); // 가벼운 저음
    }
    audio.step=(audio.step+1)%MEL.length;
  },230);
}
function toggleMute(){
  audio.muted=!audio.muted;
  const b=document.getElementById('mute'); if(b) b.textContent=audio.muted?'🔇':'🔊';
  if(!audio.muted) startMusic();
}
function blip(){ const c=ac(); if(!c||audio.muted) return; tone(880,0.08,c.currentTime,'square',0.035); }
function chime(){ const c=ac(); if(!c||audio.muted) return; [523,659,784,1047].forEach((f,i)=>tone(f,0.2,c.currentTime+i*0.09,'triangle',0.06)); }
function fanfare(){ const c=ac(); if(!c||audio.muted) return;
  [523,659,784,1047,1047].forEach((f,i)=>tone(f,0.22,c.currentTime+i*0.11,'triangle',0.075));
  tone(1319,0.45,c.currentTime+0.62,'triangle',0.06); tone(784,0.45,c.currentTime+0.62,'sine',0.04); }
function pop2(){ const c=ac(); if(!c||audio.muted) return; const o=c.createOscillator(),g=c.createGain();
  o.type='square'; o.frequency.setValueAtTime(900,c.currentTime); o.frequency.exponentialRampToValueAtTime(160,c.currentTime+0.18);
  g.gain.setValueAtTime(0.06,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.2);
  o.connect(g); g.connect(audio.master); o.start(); o.stop(c.currentTime+0.22); }

/* ---------- 정답 축하 연출 (폭죽 + 팡파레 + 칭찬) ---------- */
const PRAISE=['정답이야! 최고야! 🎉','우와~ 완벽해! 🌟','대단한걸?! 👏','똑똑이 등장! 🤩','바로 그거야! 💯','천재 아니야?! ✨'];
function confettiBurst(box){
  if(!box) return;
  const cols=['#ff6b6b','#ffd23f','#5fbf6a','#7cc4ff','#c084fc','#ff9bb0'];
  for(let i=0;i<70;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.style.left=Math.random()*100+'%';
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.4+Math.random()*1.6)+'s';
    d.style.animationDelay=(Math.random()*0.6)+'s';
    if(Math.random()<0.5) d.style.borderRadius='50%';
    box.appendChild(d);
  }
  for(let b=0;b<6;b++) setTimeout(()=>fireAt(box, 12+Math.random()*72, 12+Math.random()*42), 250+b*330);
}
function fireAt(box,xp,yp){
  if(!box||!document.body.contains(box)) return;
  const cols=['#ffd23f','#ff6b6b','#7cc4ff','#5fbf6a','#fff','#ff9bb0'];
  for(let i=0;i<12;i++){
    const a=(Math.PI*2/12)*i, f=document.createElement('div'); f.className='firework';
    f.style.left=xp+'%'; f.style.top=yp+'%'; f.style.background=cols[i%cols.length];
    f.style.setProperty('--dx',Math.cos(a)*44+'px'); f.style.setProperty('--dy',Math.sin(a)*44+'px');
    box.appendChild(f); setTimeout(()=>f.remove(),900);
  }
  pop2();
}

}

    if(p.say2) bubbles += `<div class="cbubble${p.think2?' think':''}">${p.say2}</div>`;
    cells += `<div class="${cls}">
      <div class="cbg">${p.bg?bgSVG(p.bg):''}</div>
      ${p.sfx?`<span class="csfx">${p.sfx}</span>`:''}
      <div class="cbubblezone">${bubbles}</div>
      <div class="cscene">${p.scene||''}</div>
      ${p.narr?`<div class="cnarr">${p.narr}</div>`:''}
    </div>`;
  });
  setStage(`${title?`<h2>${title}</h2>`:''}
    <div class="comicpage">${cells}</div>
    <div class="row" style="margin-top:10px">
      <button class="btn big" id="next">▶ 계속하기</button>
    </div>`);
  document.getElementById('next').onclick=()=>{ blip(); onDone(); };
}

/* ---------- level up screen ---------- */
function levelUp(newLevel, item, evolveText, onDone){
  chime();
  state.level = newLevel;
  if(item && !state.items.includes(item)) state.items.push(item);
  if(item && GEARMAP[item]) GEARMAP[item].forEach(k=>state.gear[k]=true);
  hud();
  setStage(`
    <div class="center" style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <h1>🎉 Lv.${newLevel} 달성!</h1>
      <div class="equipwrap">
        ${pc('sparkle')}
        ${item?`<div class="equipitem">${item}</div><div class="equipspark">✨</div>`:''}
      </div>
      ${item?`<p style="font-weight:800;font-size:21px">철컥! <b style="color:#e0581a">${item} 장착 완료!</b></p>`:''}
      <p style="font-weight:800">${evolveText}</p>
      <div class="row"><button class="btn big green" id="go">이야기 계속 ▶</button></div>
    </div>`);
  document.getElementById('go').onclick=()=>{ blip(); onDone(); };
}

/* Q1 — 떡 고개 (용수철 저울 / 무게)                          */
/* ========================================================= */
function sceneQ1(){
  // weights hidden; choose the lightest to carry & move fast
  const data = shuffle([{e:'🎁',w:3},{e:'📦',w:6},{e:'🧺',w:9}]);
  const hintMode = (state.char==='mother');
  let selected=null, weighed=new Set();
  function draw(){
    let units='';
    data.forEach((d,idx)=>{
      const stretched = weighed.has(idx);
      const h = stretched ? 24+d.w*9 : 24;
      const reading = stretched ? d.w+' (무게)' : (hintMode?('약 '+d.w+'?'):'?');
      units+=`<div class="spunit">
        <div class="scale" style="height:${24+9*9+20}px;position:relative">
          <div class="coil" style="height:${h}px"></div>
          <div class="hook" data-i="${idx}" style="cursor:pointer">⤵️</div>
          <div class="ddeok" data-i="${idx}">${d.e}</div>
        </div>
        <div class="reading">${reading}</div>
        <button class="btn alt" data-pick="${idx}" style="font-size:14px;padding:8px 12px">이 떡 고르기</button>
      </div>`;
    });
    setStage(`<h2>퀘스트 1 · 떡 고개를 넘어라</h2>
      <p class="sub">떡 보따리를 용수철 저울에 걸어 무게를 재 보세요.<br>가장 <b>가벼운</b> 떡을 골라야 빨리 고개를 넘어요!</p>
      <div class="springwrap">${units}</div>
      <div class="concept">🔍 떡을 걸면 용수철이 늘어나요. <b>무거울수록 용수철이 더 많이 늘어나요!</b></div>
      <div class="hint">떡(또는 ⤵️)을 눌러 무게를 재고, 가장 가벼운 떡의 '고르기'를 누르세요.</div>`);
    stage.querySelectorAll('.ddeok,.hook').forEach(el=>el.onclick=()=>{ weighed.add(+el.dataset.i); draw(); });
    stage.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>pick(+el.dataset.pick));
  }
  function pick(i){
    const minW = Math.min(...data.map(d=>d.w));
    if(data[i].w===minW){
      addScore(120);
      praise(()=> showComic({ title:'⛰️ 가벼운 떡을 골라라 〈2화〉',
        panels:[
          {bg:'hill', sfx:'영차!', say:'이게 제일 가볍네!',
           scene:`${pc('determined',{sm:true})}<span class="sm">🎁</span>`,

          {bg:'hill', sfx:'꿀꺽…', say:'근데 그거… 먹는 거 아냐?',
           scene:`${actor('squirrel','sparkle',{wob:true})}<span class="lg">🎁</span>`,
           narr:'도토리는 벌써 떡에 군침. (또 먹는 생각.)'},
          {bg:'hill', wide:true, say:'얘들아 고마워~ 무사히 넘었네!', say2:'…제 몫의 떡은요?',
           scene:`${actor('mom','laugh',{sm:true})}${pc('happy',{sm:true})}${actor('squirrel','flat',{sm:true})}`,
           narr:'1단계 성공! 발걸음이 가뿐.'}

       scene:`${actor('squirrel','laugh',{sm:true})}<span>🪵</span><span class="sm">🪨</span>`,
       narr:'받침점을 어디에 둘지 골라 바위를 들어보자!'}
    ]}, sceneLever);
}
function sceneLever(){
  function draw(fpos){
    const fl = fpos==='near'?'26%':(fpos==='mid'?'46%':'66%');
    setStage(`<h2>퀘스트 · 바위 문을 열어라 (지렛대)</h2>
      <p class="sub">받침점(▲)을 어디에 둬야 작은 힘으로 들 수 있을까요?</p>
      <div class="leverstage">
        <div class="lv-ground"></div>
        <div class="lv-beam" id="beam"></div>
        <div class="lv-ful" id="ful" style="left:${fpos?fl:'46%'}"></div>
        <div class="lv-rock" id="rock" style="left:8%">🪨</div>
        <div class="lv-press">${pc('determined',{sm:true})}</div>
      </div>
      <div class="concept">⚖️ 받침점이 바위에 <b>가까울수록</b> 작은 힘으로 번쩍! (지렛대의 원리)</div>
      <div class="row">
        <button class="btn ${fpos==='near'?'':'alt'}" data-f="near">바위 가까이</button>
        <button class="btn alt" data-f="mid">가운데</button>
        <button class="btn alt" data-f="far">바위에서 멀리</button>
      </div>
      <div class="row">${fpos?`<button class="btn big green" id="push">힘껏 눌러 들어올리기! 💪</button>`:`<div class="hint">먼저 받침점 위치를 골라요.</div>`}</div>`);
    stage.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ blip(); draw(b.dataset.f); });
    const pb=document.getElementById('push'); if(pb) pb.onclick=()=>push(fpos);
  }
  function push(fpos){
    if(fpos==='near'){
      const beam=document.getElementById('beam'), rock=document.getElementById('rock');
      if(beam){ beam.style.transformOrigin='26% 50%'; beam.style.transform='rotate(-15deg)'; }
      if(rock){ rock.style.bottom='118px'; rock.style.left='4%'; }
      pop2();
      setTimeout(()=>praise(()=>levelUp(2,'🪵','지렛대 막대를 얻었다!', sceneToQ2)), 950);
    } else {
      state.mistakes++;
      setStage(`<div class="center" style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <h2>끙… 너무 무거워요! 😣</h2>
        <p>받침점이 바위에서 멀면 큰 힘이 필요해요.<br>받침점을 <b>바위 가까이</b>에 놓아보세요!</p>
        <div class="row"><button class="btn" id="retry">다시 해보기 ▶</button></div></div>`);
      document.getElementById('retry').onclick=()=>draw(null);
    }
  }
  draw(null);
}

/* ========================================================= */
/* 수평잡기 미션 — 흔들 시소 다리                              */
/* ========================================================= */
function sceneBalanceStory(){
  showComic({ title:'⚖️ 흔들 시소 다리 〈8화〉',
    panels:[
      {bg:'forest', sfx:'삐걱삐걱', say:'다리가 한쪽으로 기울었어!',
       scene:`<span class="lg">🌉</span>${pc('shock',{sm:true})}`},
      {bg:'forest', say:'양쪽 무게를 똑같이 하면 평평해져!', say2:'그게 수평 잡기지!',
       scene:`${actor('squirrel','wink',{sm:true,wob:true})}${pc('determined',{sm:true})}`,
       narr:'양팔저울로 떡 무게를 똑같이 맞춰 다리를 건너자!'}
    ]}, sceneBalance);
}
function sceneBalance(){
  const L=3+Math.floor(Math.random()*5); let R=0;
  function draw(){
    const diff=R-L, ang=Math.max(-22,Math.min(22,diff*6)), level=(R===L);
    setStage(`<h2>퀘스트 · 시소 다리를 건너라 (수평잡기)</h2>
      <p class="sub">왼쪽 떡은 <b>${L}개</b>. 오른쪽에 떡을 올려 <b>수평</b>을 맞춰요!</p>
      <div class="balstage">
        <div class="bl-post"></div>
        <div class="bl-ful"></div>
        <div class="bl-beam" style="transform:rotate(${ang}deg)">
          <div class="bl-pan l"><span class="bl-w">${L}</span>🍡</div>
          <div class="bl-pan r"><span class="bl-w">${R}</span>🍡</div>
        </div>
      </div>
      <div class="concept">⚖️ 양쪽 <b>무게가 같으면</b> 수평이 돼요. (수평 잡기)</div>
      <div class="row">
        <button class="btn alt" id="minus">➖ 빼기</button>
        <span class="pill" style="background:#eee;color:#333;font-weight:800">오른쪽 ${R}개</span>
        <button class="btn alt" id="plus">➕ 놓기</button>
      </div>
      <div class="row">${level?`<button class="btn big green" id="cross">수평 완성! 다리 건너기 ▶</button>`
        :`<div class="hint">${diff>0?'오른쪽이 더 무거워요 (오른쪽이 내려가요)':'왼쪽이 더 무거워요 (떡을 더 놓아요)'}</div>`}</div>`);
    document.getElementById('minus').onclick=()=>{ R=Math.max(0,R-1); blip(); draw(); };
    document.getElementById('plus').onclick=()=>{ R=Math.min(9,R+1); blip(); draw(); };
    const cb=document.getElementById('cross'); if(cb) cb.onclick=()=>praise(()=>levelUp(5,'⚖️','수평저울 배지를 얻었다!', sceneToBoss));
  }
  draw();
}

function sceneToBoss(){
  showComic({ title:'⭐ 마지막 하늘 길 〈9화〉',
    panels:[
      {bg:'sky', say:'끝까지 오르면 해와 달이 된대!',
       scene:`${pc('sparkle',{sm:true})}`},
      {bg:'night', sfx:'우르르!', say:'으악, 위에서 막 떨어져!',
       scene:'<span class="sm">🪨</span><span class="sm wob">🌰</span><span class="sm">🍎</span>', narr:'돌과 열매가 우수수… 모두 아래로(중력!).'},
      {bg:'night', wide:true, say:'잘 피하면서 줄을 당기자!', say2:'응원은 내가! (또 매달림)',
       scene:`${pc('determined',{sm:true})}${actor('squirrel','laugh',{sm:true,wob:true})}`,
       narr:'← → 로 피하고, 당기기로 올라가요!'}
    ]}, sceneBoss);
}

/* ========================================================= */
/* BOSS — 하늘 오르기 (중력 + 당기는 힘)                       */
/* ========================================================= */
function sceneBoss(){
  setStage(`<h2>파이널 · 하늘 끝으로!</h2>
    <div id="boss">
      <div id="hero" style="left:46%">${pc('determined',{sm:true})}</div>
    </div>
    <div class="meterbox" style="margin-top:8px"><div class="meter" id="bm" style="width:0%"></div></div>
    <div class="row">
      <button class="btn alt" id="left">◀</button>
      <button class="btn big" id="pull">🪢 당기기</button>
      <button class="btn alt" id="right">▶</button>
    </div>
    <div class="hint">← → (또는 버튼)으로 피하고, 스페이스바/당기기로 올라가요. 올라갈수록 돌이 더 빨라져요! 부딪혀도 끝나지 않아요.</div>`);

  const area=document.getElementById('boss');
  const hero=document.getElementById('hero');
  const W=area.clientWidth;
  let hx=W*0.46, climb=0;
  const moonBonus = (state.char==='moon'); // 작은 히트박스
  const heroW = moonBonus?30:40;

  function place(){ hero.style.left=Math.max(2,Math.min(W-40,hx))+'px'; }
  place();
  function move(d){ hx+=d; place(); }
  function pull(){ climb=Math.min(100,climb+(CHARS[state.char].pull*0.6)); document.getElementById('bm').style.width=climb+'%';
    if(climb>=100){ endBoss(); } }

  document.getElementById('left').onclick=()=>move(-34);
  document.getElementById('right').onclick=()=>move(34);
  document.getElementById('pull').onclick=pull;
  keyHandler=(e)=>{
    if(e.code==='ArrowLeft'){move(-30);}
    else if(e.code==='ArrowRight'){move(30);}
    else if(e.code==='Space'){e.preventDefault();pull();}
  };
  window.addEventListener('keydown',keyHandler);

  // falling objects (난이도: 더 빠르고 잦게, 위로 갈수록 가속)
  const objs=[]; const emos=['🪨','🌰','🍎','🪨','☄️'];
  function spawnOne(){
    const el=document.createElement('div'); el.className='falling';
    el.textContent=emos[Math.floor(Math.random()*emos.length)];
    const x=Math.random()*(W-30); el.style.left=x+'px'; el.style.top='-30px';
    area.appendChild(el); objs.push({el,x,y:-30,vy:2.7+Math.random()*2.1+climb*0.03});
  }
  const spawn=setInterval(()=>{
    spawnOne();
    if(climb>50 && Math.random()<0.55) spawnOne(); // 후반엔 두 개씩
  },540); timers.push(spawn);

  let ended=false;
  function loop(){
    if(ended) return;
    const heroBottom=6, heroTop=44;
    for(let i=objs.length-1;i>=0;i--){
      const o=objs[i]; o.y+=o.vy; o.el.style.top=o.y+'px';
      // collision near bottom
      const areaH=area.clientHeight;
      if(o.y>areaH-heroTop && o.y<areaH-heroBottom){
        if(Math.abs((o.x+15)-(hx+heroW/2))<heroW/2+14){
          // hit
          climb=Math.max(0,climb-14);
          document.getElementById('bm').style.width=climb+'%';
          hero.classList.add('flash'); setTimeout(()=>hero.classList.remove('flash'),300);
          o.el.remove(); objs.splice(i,1); continue;
        }
      }
      if(o.y>areaH){ o.el.remove(); objs.splice(i,1); }
    }
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);

  function endBoss(){ if(ended)return; ended=true; clearAll(); addScore(200); praise(sceneEnding); }
}

/* ========================================================= */
/* ENDING                                                     */
/* ========================================================= */
function sceneEnding(){
  const ev=CHARS[state.char].evolve;
  const partner = state.char==='sun'?'🌙 달':'☀️ 해';
  state.gear.crown=true; state.gear.trophy=true;
  showComic({ title:'🌞🌙 해와 달이 되다 〈마지막 화〉',
    panels:[
      {bg:'sky', sfx:'반짝!✨', say:'드디어 하늘 끝!',
       scene:`${pc('sparkle',{sm:true})}`},
      {bg:'sunmoon', say:`나는 ${ev}!`, say2:`나는 ${partner}!`,
       scene:`<span class="lg">${ev.split(' ')[0]}</span><span class="lg">${partner.split(' ')[0]}</span>`,
       narr:'한 사람은 해, 한 사람은 달이 되었어요.'},
      {bg:'sunmoon', say:'그래서 낮엔 해, 밤엔 달이 비춘대요!',
       scene:'<span>☀️</span><span>🌙</span>'},
      {bg:'home_out', wide:true, sfx:'…저기요', say:'그래서… 제 떡은요?', say2:'아직도 그 얘기야?!',
       scene:`${actor('squirrel','cry',{wob:true})}${pc('laugh',{sm:true})}`,
       narr:'끝! (도토리는 끝까지 떡 생각.)'}
    ]}, ()=>{
    state.level=Math.max(state.level,99);
    if(!state.items.includes('🏆')) state.items.push('🏆');
    hud();
    const grade = state.mistakes===0?'완벽해요! 별 다섯! ⭐⭐⭐⭐⭐':(state.mistakes<=2?'아주 잘했어요! ⭐⭐⭐⭐':'끝까지 해냈어요! ⭐⭐⭐');
    setStage(`<div class="center" style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <div class="equipwrap" style="height:170px">${pc('laugh')}<div class="equipspark" style="left:60%">✨</div></div>
      <h1>클리어! ${ev.split(' ')[0]}</h1>
      <p class="win">${grade}</p>
      <div class="concept" style="text-align:left">
        오늘 배운 힘의 비밀 🌟<br>
        ① 무거울수록 <b>용수철</b>이 더 늘어나요<br>
        ② 줄을 <b>당기면</b> 몸이 위로 올라가요<br>
        ③ 무거울수록 줄에 <b>큰 힘</b>이 걸려요<br>
        ④ 모든 물체는 아래로 떨어져요(<b>중력</b>)
      </div>
      <p style="font-weight:800">우리 모둠 점수: ⭐ ${state.score}점</p>
      <div class="row">
        <button class="btn big green" id="again">다른 주인공으로 다시! 🔁</button>
      </div>
    </div>`);
    document.getElementById('again').onclick=sceneSelect;
  });
}

/* ---------- utils ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- start ---------- */
document.getElementById('mute').onclick=toggleMute;
hud(); sceneTitle();
</script>
